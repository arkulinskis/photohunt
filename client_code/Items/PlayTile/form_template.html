<div class="pt-host">
<button type="button" class="pt" anvil:dom-node="btn" anvil:on-dom:click="self.btn_click">
  <span class="pt-num" anvil:dom-node="num"></span>
  <span class="pt-pic"><anvil-component type="PhotoHunt.Components.Photo" name="photo"></anvil-component></span>
  <span class="pt-task" anvil:dom-node="task" aria-hidden="true"><i class="ic ic-star"></i></span>
  <span class="pt-name" anvil:dom-node="name"></span>
  <span class="pt-state" anvil:dom-node="state"></span>
</button>
</div>
