<div class="cert">
  <div class="cert-in">
    <anvil-component type="PhotoHunt.Components.Topper" name="topper" prop:size="72"></anvil-component>
    <h2 class="cert-title">Super Hunter certificate</h2>
    <anvil-component type="Label" name="name" prop:role='["cert-name"]' bind:text="self.item['name']"></anvil-component>
    <anvil-component type="Label" name="what" prop:role='["cert-what"]'></anvil-component>
    <anvil-component type="RepeatingPanel" name="stickers_panel" prop:item_template="PhotoHunt.Items.StickerItem" prop:role='["rr-stickers"]'></anvil-component>
    <anvil-component type="Label" name="hunt" prop:role='["cert-hunt"]'></anvil-component>
  </div>
</div>
