metadata:
  description: "Make a photo scavenger hunt in five minutes: snap things at home, kids scan a QR code and race to find and photograph them."
  logo_img: "asset:icon-512.png"
  title: "PhotoHunt: a photo treasure hunt for kids' birthday parties"
name: PhotoHunt
